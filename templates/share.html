<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }} · Shared Note</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;600;700&family=Poppins:wght@400;600&family=Raleway:wght@400;600;700&family=Quicksand:wght@500;600&family=Ubuntu:wght@400;500;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&family=Source+Code+Pro:wght@400;600&family=JetBrains+Mono:wght@400;600;700&family=Caveat:wght@500;700&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
      color: #1f2937;
      background: #f9fafb;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e5e7eb; background: #111827; }
      .card { background: #1f2937; border-color: #374151 !important; }
      .dot { background: #6b7280 !important; }
      .tag { background: #374151 !important; color: #d1d5db !important; }
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px 28px 28px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .card h1 {
      margin: 12px 0 4px;
      font-size: 26px;
      line-height: 1.3;
      color: inherit;
      overflow-wrap: anywhere;
    }
    .meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #6b7280; flex-wrap: wrap; }
    .dot { width: 4px; height: 4px; border-radius: 50%; background: #d1d5db; }
    .tag {
      display: inline-block;
      background: #f3f4f6;
      border-radius: 999px;
      padding: 1px 10px;
      font-size: 11.5px;
      color: #4b5563;
    }
    .hr { border: 0; border-top: 1px solid #e5e7eb; margin: 16px 0 20px; }
    .content { font-size: 15px; overflow-wrap: anywhere; }
    .content img { max-width: 100%; height: auto; border-radius: 8px; }
    .content table { border-collapse: collapse; width: 100%; }
    .content td, .content th { border: 1px solid #d1d5db; padding: 6px 10px; }
    .content pre { background: #f3f4f6; border-radius: 8px; padding: 12px; overflow-x: auto; }
    .content blockquote { border-left: 3px solid #9ca3af; margin-left: 0; padding-left: 14px; color: #4b5563; }
    .foot { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      {% if missing %}
        <h1>Not found</h1>
        <p class="meta">This share link is invalid or the note was removed.</p>
      {% else %}
        <h1>{{ title }}</h1>
        <div class="meta">
          <span>{{ meta }}</span>
          {% if tags %}<span class="dot"></span>
          {% for t in tags.split(",") %}{% if t.strip() %}<span class="tag">#{{ t.strip() }}</span>{% endif %}{% endfor %}{% endif %}
        </div>
        <hr class="hr">
        <div class="content">{{ content | safe }}</div>
      {% endif %}
    </div>
    <p class="foot">Shared from Personal Assistant</p>
  </div>
</body>
</html>
